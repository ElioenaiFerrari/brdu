[package]
name = "brdu-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "BRDU primitives: SHA3-256 hash with domain prefix, Ed25519, bech32m addresses, deterministic encoding, 6-decimal amounts and Merkle trees. no_std + alloc."

[features]
default = []
# batch signature verification (uses the system random number generator, so it needs std)
batch = ["ed25519-dalek/batch"]

[dependencies]
sha3.workspace = true
ed25519-dalek.workspace = true
bech32.workspace = true
zeroize.workspace = true
subtle.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
